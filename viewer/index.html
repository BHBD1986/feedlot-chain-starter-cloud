<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Feedlot Ledger Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 1600px; background: #f4f7f6; }
    .box { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; font-size: 12px; overflow: hidden; }
    th { background: #eee; text-align: left; position: sticky; top: 0; }
    
    /* This makes the Tag column pop so you know it's working */
    .tag-highlight { background-color: #e8f4ff; font-weight: bold; color: #007bff; border: 2px solid #007bff !important; }
    
    .mono { font-family: monospace; color: #555; }
    pre { margin: 0; white-space: pre-wrap; font-size: 11px; background: #fafafa; border: 1px solid #eee; padding: 4px; }
    .pill { display: inline-block; padding: 2px 6px; border-radius: 4px; background: #d4edda; color: #155724; font-weight: bold; }
  </style>
</head>
<body>

<h2>Feedlot Ledger Viewer</h2>

<div class="box">
  <button onclick="loadLedger()" style="padding: 10px 20px; cursor:pointer;">RELOAD DATA</button>
  <span id="status" style="margin-left: 10px; color: #666;"></span>
</div>

<table id="ledgerTable">
  <thead>
    <tr>
      <th style="width: 60px;">Block #</th>
      <th style="width: 100px;">Block Hash</th>
      <th style="width: 100px;">Prev Hash</th>
      <th style="width: 150px;">Event ID</th>
      <th style="width: 130px;">Type</th>
      <th style="width: 160px;">Timestamp</th>
      <th style="width: 80px;">Role</th>
      <th style="width: 110px;">Submitted By</th>
      <th style="width: 150px;">CCIA Tag</th> 
      <th>Payload</th>
      <th style="width: 80px;">Actions</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
async function loadLedger() {
  const status = document.getElementById("status");
  const tbody = document.getElementById("tbody");
  status.innerText = "Loading...";

  try {
    const res = await fetch("https://feedlot-chain-starter-cloud-1.onrender.com/api/events?limit=100");
    const data = await res.json();
    
    tbody.innerHTML = "";

    // Sort newest to oldest
    const events = data.events.sort((a, b) => b.blockNumber - a.blockNumber);

    events.forEach(e => {
      const tr = document.createElement("tr");

      // We precisely map the 11 columns here
      tr.innerHTML = `
        <td class="mono">${e.blockNumber ?? ""}</td>
        <td class="mono">${(e.blockHash || "0x00...").substring(0,8)}...</td>
        <td class="mono">${(e.prevHash || "0x00...").substring(0,8)}...</td>
        <td class="mono">${e.eventId || "N/A"}</td>
        <td><span class="pill">${e.eventType}</span></td>
        <td>${new Date(e.at).toLocaleString()}</td>
        <td>${e.role || ""}</td>
        <td class="mono" title="${e.submittedBy}">${(e.submittedBy || "").substring(0,8)}...</td>
        <td class="tag-highlight">${e.tag ||e.payload?.tag || (e.payloadJson ? JSON.parse(e.payloadJson).tag : "") || "NOT FOUND"}</td>
        <td><pre>${JSON.stringify(e.payload, null, 2)}</pre></td>
        <td><button onclick="alert('Block: ${e.blockNumber}')">View</button></td>
      `;
      tbody.appendChild(tr);
    });

    status.innerText = "Success: " + events.length + " events loaded.";
  } catch (err) {
    status.innerText = "Error loading data.";
    console.error(err);
  }
}

// Start
loadLedger();
</script>

</body>
</html>

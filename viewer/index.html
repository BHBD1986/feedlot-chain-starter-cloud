<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Feedlot Ledger Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 1600px; }
    input, select, button { padding: 6px; margin: 4px; }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .box { border: 1px solid #ddd; padding: 12px; border-radius: 10px; margin: 12px 0; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; overflow: hidden; text-overflow: ellipsis; }
    th { background: #eee; text-align: left; font-size: 12px; text-transform: uppercase; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 11px; }
    .muted { color:#666; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; border:1px solid #ddd; background:#fafafa; }
    .pill.bad { border-color:#f1c7c7; background:#fff5f5; color: #a33; }
    .pill.good { border-color:#c7f1d3; background:#f3fff6; color: #2a7; }
    .warn { color:#a33; font-weight:600; }
    .ok { color:#2a7; font-weight:600; }
    .mono { font-family: "Courier New", monospace; font-size: 11px; }
    .small { font-size: 12px; }
    .right { margin-left:auto; }
    .btn { cursor:pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
    .btn:hover { background: #e0e0e0; }
    .hl { background:#fffef0; }
    /* CCIA Tag Styling */
    .tag-cell { background-color: #e8f4ff; font-weight: bold; border-left: 3px solid #007bff !important; }
  </style>
</head>
<body>

<h2>Feedlot Ledger – Event Viewer</h2>
<div class="muted">Live append-only blockchain ledger for CCIA cattle tracking.</div>

<div class="box">
  <div class="row">
    <div class="rowline">
      <label><b>CCIA Tag Filter:</b></label>
      <input id="tag" size="26" placeholder="Enter Tag #" />
      <button class="btn" onclick="loadEvents()">Filter</button>
      <button class="btn" onclick="loadAll()">View All</button>
    </div>
    <div class="rowline right">
      <button class="btn" onclick="checkStatus()">Refresh Status</button>
      <span id="statusOut" class="small muted"></span>
    </div>
  </div>
</div>

<table id="events">
<thead>
  <tr>
    <th style="width: 60px;">Block #</th>
    <th style="width: 100px;">Block Hash</th>
    <th style="width: 100px;">Prev Hash</th>
    <th style="width: 150px;">Event ID</th>
    <th style="width: 140px;">Type</th>
    <th style="width: 160px;">Timestamp</th>
    <th style="width: 80px;">Role</th>
    <th style="width: 110px;">Submitted By</th>
    <th style="width: 150px;" class="tag-cell">CCIA Tag</th>
    <th>Payload</th>
    <th style="width: 80px;">Actions</th>
  </tr>
</thead>
  <tbody></tbody>
</table>

<script>
const API_BASE = "https://feedlot-chain-starter-cloud-1.onrender.com";

function shortHash(h) {
  if (!h) return "000000...";
  return h.length <= 10 ? h : (h.slice(0, 8) + "...");
}

async function checkStatus() {
  const out = document.getElementById("statusOut");
  try {
    const res = await fetch(`${API_BASE}/api/status`);
    const data = await res.json();
    out.textContent = `Node Online | Height: ${data.latestBlock ?? 0}`;
    out.className = "small ok";
  } catch (e) {
    out.textContent = "Node Connection Error";
    out.className = "small warn";
  }
}

async function loadEvents() {
  const tagFilter = document.getElementById("tag").value.trim();
  const tbody = document.querySelector("#events tbody");
  tbody.innerHTML = "<tr><td colspan='11'>Loading ledger data...</td></tr>";

  try {
    const res = await fetch(`${API_BASE}/api/events?limit=500`);
    const data = await res.json();
    const events = data.events || [];
    
    tbody.innerHTML = "";
    // Reverse to show newest at the top
    const list = [...events].reverse();

    list.forEach(e => {
      if (tagFilter && e.tag !== tagFilter) return;

      const tr = document.createElement("tr");
      if (e.eventType.includes("VOIDED") || e.eventType.includes("CORRECTED")) tr.classList.add("hl");

      tr.innerHTML = `
        <td class="mono">${e.blockNumber ?? ""}</td>
        <td class="mono" title="${e.blockHash}">${shortHash(e.blockHash)}</td>
        <td class="mono" title="${e.prevHash}">${shortHash(e.prevHash)}</td>
        <td class="mono">${e.eventId || ""}</td>
        <td><span class="${tr.classList.contains('hl') ? 'pill bad' : 'pill good'}">${e.eventType}</span></td>
        <td class="small">${new Date(e.at).toLocaleString()}</td>
        <td class="small">${e.role || ""}</td>
        <td class="small">${e.submittedBy || ""}</td>
        <td class="tag-cell">${e.tag || "N/A"}</td>
        <td><pre>${JSON.stringify(e.payload, null, 2)}</pre></td>
        <td>
          <button class="btn small" onclick="navigator.clipboard.writeText('${e.eventId}')">Copy ID</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = "<tr><td colspan='11' class='warn'>Error loading events from blockchain.</td></tr>";
  }
}

function loadAll() {
  document.getElementById("tag").value = "";
  loadEvents();
}

// Initial Load
checkStatus();
loadEvents();
</script>

</body>
</html>
